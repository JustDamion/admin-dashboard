<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="sidebar">
        <div class="sidebar__branding">
            <img src="images/icons/view-dashboard.svg" alt="">
            <h1>Dashboard</h1>
        </div>

        <nav class="sidebar__nav">
            <ul>
                <li><img class="nav__icon" src="images/icons/home.svg" alt="">Home</li>
                <li><img class="nav__icon" src="images/icons/card-account-details-outline.svg" alt="">Profile</li>
                <li><img class="nav__icon" src="images/icons/message-reply.svg" alt="">Messages</li>
                <li><img class="nav__icon" src="images/icons/clock-time-three.svg" alt="">History</li>
                <li><img class="nav__icon" src="images/icons/palette-swatch.svg" alt="">Tasks</li>
                <li><img class="nav__icon" src="images/icons/account-group.svg" alt="">Communities</li>
            </ul>

            <ul>
                <li><img class="nav__icon" src="images/icons/cog.svg" alt="">Settings</li>
                <li><img class="nav__icon" src="images/icons/help-box.svg" alt="">Support</li>
                <li><img class="nav__icon" src="images/icons/shield-check.svg" alt="">Privacy</li>
            </ul>
        </nav>
    </div>

    <header>
        <div class="header__searchbar">
            <img src="images/icons/magnify.svg" alt="">
            <input type="text" name="search" id="search">
        </div>

        <div class="header__right-user-info">
            <img src="images/icons/bell-ring-outline.svg" alt="">
            <img src="images/icons/account-circle.svg" alt="">
            <p>Damion Shirkey</p>
        </div>

        <div class="header__left-user-info">
            <img src="images/icons/account-circle.svg" alt="">
            <div>
                <p class="greeting">Hi there,</p>
                <p class="name">Damion Shirkey (@damion)</p>
            </div>
        </div>

        <div class="header__inputs">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
        </div>
    </header>

    <main></main>
</body>

</html>
